plugins {
    id 'application'
    id 'jacoco'
}

group 'com'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext.graalvmVersion = '23.1.2'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.graalvm.polyglot:polyglot:$graalvmVersion"
    implementation "org.graalvm.polyglot:js:$graalvmVersion"
    implementation "org.graalvm.polyglot:python:$graalvmVersion"
    implementation "org.antlr:antlr4-runtime:4.7"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.90
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

jar {
    manifest {
        attributes 'Main-Class': 'Application'
    }
}

application {
    mainClass = 'Application'
    applicationDistribution.from("/scripts") {
        include "*"
    }
}

distributions {
    main {
        distributionBaseName = "HelloWorld"
        contents {
            into('scripts') {
                from 'scripts/'
            }
        }
    }
}
